[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FaezBarghasa/Oxide-mesh-net"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.38", features = [
    "full",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "net",
    "process",
    "signal",
    "tracing",
] }
async-trait = "0.1.77"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "3.0.0"
postcard = "1.0"
rmp-serde = "1.1"

# Cryptography
rustls = { version = "0.23", features = [
    "logging",
    "std",
    "tls12",
    "aws-lc-rs",
] }
ring = { version = "0.17", features = ["std"] }
x25519-dalek = { version = "3.0.0", features = [
    "static_secrets",
    "serde",
    "zeroize",
] }
ed25519-dalek = { version = "3.0.0", features = [
    "serde",
    "zeroize",
    "rand_core",
] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
blake3 = "1.5"
chacha20poly1305 = "0.11.0"
aes-gcm = "0.11.1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = { version = "0.10.3", features = ["std"] }
rand_core = { version = "0.10.1", features = ["std"] }
rand_chacha = "0.10.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hkdf = "0.13.0"
subtle = "2.5"

# QUIC transport
quinn = { version = "0.11", features = ["rustls"] }
quinn-proto = { version = "0.11", features = ["rustls"] }
quinn-udp = "0.6.2"

# MQTT & Databases
rumqttc = "0.25.1"
rumqttd = "0.20.0"
surrealdb = { version = "3.3.0", default-features = false, features = [
    "kv-mem",
    "kv-surrealkv",
    "protocol-ws",
    "rustls",
] }

# Network & TUN
socket2 = "0.6.5"
ipnet = "2.8"
pnet = { version = "0.35", features = ["packet", "datalink"] }

# Platform-specific
cfg-if = "1.0"

# Logging & Tracing
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "json",
    "env-filter",
    "registry",
    "std",
] }
tracing-appender = { version = "0.2.5", features = ["non-blocking", "std"] }
eyre = "0.6"
thiserror = "2.0.21"

# Utilities
bytes = { version = "1.6", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "6.1"
slab = "0.4"
arc-swap = "1.6"
once_cell = "1.19"
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
time = { version = "0.3", features = [
    "serde",
    "formatting",
    "parsing",
    "local-offset",
] }
clap = { version = "4.5", features = ["derive", "env", "std"] }
figment = { version = "0.10.19", features = ["toml", "env", "serde"] }
dirs = "7.0.0"
bs58 = "0.5"
hex = "0.4"

# SIMD & Performance
memoffset = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
bytemuck = { version = "1.15", features = ["derive"] }

# Testing
proptest = { version = "1.4", features = ["std"] }
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

# Fuzzing
arbitrary = { version = "1.3", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-lto]
inherits = "release"
lto = "thin"

[profile.bench]
inherits = "release"
debug = true
