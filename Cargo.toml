[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxide-mesh/oxide-mesh-net"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros", "sync", "time", "fs", "net", "process", "signal", "tracing"] }
async-trait = "0.1.77"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "1.3", features = ["serde"] }
postcard = "1.0"
rmp-serde = "1.1"

# Cryptography
rustls = { version = "0.23", features = ["dangerous_configuration", "logging", "std", "tls12", "tls13", "aws-lc-rs"] }
ring = { version = "0.17", features = ["std"] }
x25519-dalek = "2.0"
ed25519-dalek = "2.1"
p256 = { version = "0.13", features = ["pkcs8", "pem", "der"] }
p384 = { version = "0.13", features = ["pkcs8", "pem", "der"] }
blake3 = "1.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rand = { version = "0.9", features = ["std", "getrandom"] }
rand_chacha = "0.3"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
subtle = "2.5"

# QUIC transport
quinn = { version = "0.11", features = ["rustls", "std"] }
quinn-proto = { version = "0.11", features = ["rustls", "std"] }
quinn-udp = { version = "0.11", features = ["rustls", "std"] }

# MQTT
rumqttc = { version = "0.23", features = ["tokio-rustls", "websockets", "tcp"] }
rumqttd = { version = "0.11", features = ["tokio", "tcp", "websockets", "tls"] }

# Network & TUN
socket2 = "0.5"
ipnet = "2.8"
pnet = { version = "0.35", features = ["packet", "datalink"] }

# Platform-specific
cfg-if = "1.0"

# Logging & Tracing
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter", "registry", "std"] }
tracing-appender = { version = "0.6", features = ["non-blocking", "std"] }
eyre = "0.6"
thiserror = "1.0"

# Utilities
bytes = { version = "1.6", features = ["serde"] }
smallvec = "1.13"
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "6.1"
slab = "0.4"
arc-swap = "1.6"
once_cell = "1.19"
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset"] }
clap = { version = "4.5", features = ["derive", "env", "std"] }
figment = { version = "0.11", features = ["toml", "env", "serde"] }
dirs = "5.0"

# SIMD & Performance
portable-simd = { version = "0.3", features = ["std"] }
memoffset = "0.9"
zerocopy = { version = "0.8", features = ["derive", "serde"] }
bytemuck = { version = "1.15", features = ["derive"] }

# Testing
proptest = { version = "1.4", features = ["std"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Fuzzing
arbitrary = { version = "1.3", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-lto]
inherits = "release"
lto = "thin"

[profile.bench]
inherits = "release"
debug = true