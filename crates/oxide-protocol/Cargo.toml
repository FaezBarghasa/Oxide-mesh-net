[package]
name = "oxide-protocol"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
categories = ["network-programming", "protocols"]
description = "Wire protocol and control plane schemas for oxide-mesh-net"

[dependencies]
oxide-core = { path = "../oxide-core" }
oxide-crypto = { path = "../oxide-crypto" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bincode = { workspace = true }
postcard = { workspace = true }
bytes = { workspace = true }
zerocopy = { workspace = true, features = ["derive", "serde"] }
bytemuck = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde", "fast-rng"] }
time = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }