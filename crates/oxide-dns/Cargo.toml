[package]
name = "oxide-dns"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
categories = ["network-programming", "dns"]
description = "MagicDNS and split-DNS engine for oxide-mesh-net"

[dependencies]
oxide-core = { path = "../oxide-core" }
oxide-crypto = { path = "../oxide-crypto" }
oxide-protocol = { path = "../oxide-protocol" }
tokio = { workspace = true }
trust-dns-server = { version = "0.23", features = ["sqlite", "rustls", "tokio"] }
trust-dns-resolver = { version = "0.23", features = ["rustls", "tokio", "dns-over-https"] }
trust-dns-proto = { version = "0.23", features = ["rustls", "tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = "1.0"
tracing = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
time = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde", "fast-rng"] }
cfg-if = { workspace = true }
hickory-dns = { version = "0.23", features = ["sqlite", "rustls", "tokio"] }
hickory-resolver = { version = "0.23", features = ["rustls", "tokio", "dns-over-https"] }
hickory-proto = { version = "0.23", features = ["rustls", "tokio"] }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }